{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-shadow">
            <div class="card-body p-5">
                <h3 class="text-center fw-bold mb-4"><i class="bi bi-box-arrow-in-right text-primary me-2"></i><span data-i18n="login_title">Welcome Back</span></h3>
                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label fw-semibold" data-i18n="username">Username</label>
                        <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" data-i18n="password">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100"><span data-i18n="login_btn">Login</span> <i class="bi bi-arrow-right ms-2"></i></button>
                </form>
                <p class="text-center mt-4 mb-0 text-muted">
                    <span data-i18n="no_account">Don't have an account?</span> <a href="/register" class="text-primary fw-semibold" data-i18n="nav_register">Register</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
