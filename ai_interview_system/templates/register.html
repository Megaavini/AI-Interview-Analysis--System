{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card card-shadow">
            <div class="card-body p-5">
                <h3 class="text-center fw-bold mb-4"><i class="bi bi-person-plus text-primary me-2"></i><span data-i18n="register_title">Create Account</span></h3>
                <form method="POST" action="/register" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label fw-semibold" data-i18n="full_name">Full name</label>
                        <input type="text" name="full_name" class="form-control form-control-lg" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold" data-i18n="username">Username</label>
                            <input type="text" name="username" class="form-control form-control-lg" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold" data-i18n="password">Password</label>
                            <input type="password" name="password" class="form-control form-control-lg" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold" data-i18n="email">E-mail</label>
                            <input type="email" name="email" class="form-control form-control-lg" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold" data-i18n="phone">Phone (optional)</label>
                            <input type="tel" name="phone" class="form-control form-control-lg">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold"><i class="bi bi-file-earmark-person me-1"></i><span data-i18n="resume_opt">Resume (PDF / DOC / DOCX, optional)</span></label>
                        <input type="file" name="resume" class="form-control" accept=".pdf,.doc,.docx">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100"><span data-i18n="register_btn">Register</span> <i class="bi bi-person-check ms-2"></i></button>
                </form>
                <p class="text-center mt-4 mb-0 text-muted">
                    <span data-i18n="have_account">Already have an account?</span> <a href="/login" class="text-primary fw-semibold" data-i18n="nav_login">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
