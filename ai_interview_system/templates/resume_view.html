<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume - {{ name }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; background: #e5e7eb; }
  .bar { height: 52px; background: #1e293b; color: #fff; display: flex; align-items: center; padding: 0 16px; gap: 12px; }
  .view { height: calc(100% - 52px); }
  .view iframe, .view embed { width: 100%; height: 100%; border: 0; background: #fff; }
  .msg { max-width: 460px; margin: 80px auto; text-align: center; }
</style>
</head>
<body>
<div class="bar">
  <i class="bi bi-file-earmark-person fs-5"></i>
  <b class="text-truncate">{{ name }} - resume ({{ ext|upper }})</b>
  <span class="ms-auto d-flex gap-2">
    <a class="btn btn-sm btn-light" href="/resume/{{ uid }}/raw" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i> Open</a>
    <a class="btn btn-sm btn-primary" href="/resume/{{ uid }}"><i class="bi bi-download"></i> Download</a>
  </span>
</div>

<div class="view">
{% if ext == 'pdf' %}
  <iframe src="/resume/{{ uid }}/raw#toolbar=1&navpanes=0" title="Resume"></iframe>
{% elif ext == 'docx' %}
  <div id="loading" class="msg text-muted"><div class="spinner-border mb-3"></div><div>Loading resume…</div></div>
  <iframe id="docFrame" sandbox="" class="d-none" title="Resume"></iframe>
  <div id="docErr" class="msg d-none">
    <div class="alert alert-warning">This Word file could not be displayed on screen.</div>
    <a class="btn btn-primary" href="/resume/{{ uid }}"><i class="bi bi-download"></i> Download instead</a>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script>
    (async () => {
      const fail = () => { document.getElementById('loading').classList.add('d-none'); document.getElementById('docErr').classList.remove('d-none'); };
      try {
        const buf = await (await fetch('/resume/{{ uid }}/raw')).arrayBuffer();
        const out = await mammoth.convertToHtml({arrayBuffer: buf});
        // sandboxed iframe (no scripts allowed) so nothing inside a resume can run code
        const css = 'body{font-family:Arial,sans-serif;max-width:800px;margin:28px auto;padding:0 24px;line-height:1.5;color:#111}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:4px 8px}';
        const f = document.getElementById('docFrame');
        f.srcdoc = '<!DOCTYPE html><meta charset="utf-8"><style>' + css + '</style>' + out.value;
        f.classList.remove('d-none'); document.getElementById('loading').classList.add('d-none');
      } catch (e) { fail(); }
    })();
  </script>
{% else %}
  <div class="msg">
    <div class="alert alert-info">Old <b>.doc</b> files cannot be previewed in the browser.<br>Download it to read it.</div>
    <a class="btn btn-primary" href="/resume/{{ uid }}"><i class="bi bi-download"></i> Download resume</a>
  </div>
{% endif %}
</div>
</body>
</html>
